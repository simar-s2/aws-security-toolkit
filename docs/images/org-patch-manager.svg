<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3b"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="216" y2="216">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <rect id="shape" x="28" y="84" width="200" height="88" rx="44"/>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <g transform="rotate(-45 128 128)">
    <use href="#shape" fill="url(#accent)" filter="url(#glow)" opacity="0.6"/>
    <use href="#shape" fill="url(#accent)"/>
    <rect x="90" y="84" width="76" height="88" fill="#f8fafc"/>
    <g fill="#232a3b">
      <circle cx="110" cy="108" r="6"/>
      <circle cx="146" cy="108" r="6"/>
      <circle cx="128" cy="128" r="6"/>
      <circle cx="110" cy="148" r="6"/>
      <circle cx="146" cy="148" r="6"/>
    </g>
  </g>
</svg>
